<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
<fieldset>
    <legend><h1>Biodata</h1></legend><b></b>
    <form action ="#">
         <label for="Name">Name:</label>
        <input type="text" name="Name" id="Name" placeholder="Enter your name" required>
       <br><br>
       <label for="password">Password:</label>
       <input type ="password" name="Password" id="Password" placeholder="Enter your password" required>
       <br><br>
       <label for="Phone">Phone:</label>
       <input type ="tel" name="Phone" id="tel" placeholder="Enter your phone number" required>
       <br><br>
       <label for="Email">Email:</label>
       <input type="email" name="Email" id="Email" placeholder="Enter your email" required>
       <br><br>
       <label for="date">Date of Birth:</label>
       <input type="date" name="DateOfBirth" id="DateOfBirth" required>
         <br><br>
         <label for="Address">Address:</label>
         <textarea name="Address" id="Address" placeholder="Enter your address" required></textarea>
         <br><br>
         <label for="Gender">Gender:</label>
        <input type="radio" name="Gender" id="Male" value="Male" required> <label for="Male">Male</label>
        <input type="radio" name="Gender" id="Female" value="Female" required> <label for="Female">Female</label>
        <br><br>
        <label for="hobb">Hobbies:</label>
        <input type="checkbox" name="hobb1" id="Cricket"> <label for="Cricket">Cricket</label>
        <input type="checkbox" name="hobb2" id="Football"> <label for="Football">Football</label>
        <input type="checkbox" name="hobb3" id="Reading"> <label for="Reading">Reading</label>
        <input type="checkbox" name="hobb4" id="Travelling"> <label for="Travelling">Travelling</label>
        <br><br>
        <label for+"lang">Select any one Programming Language:</label>
        <select name="lang" id="lang">
            <option value="Select">Select</option>
            <option value="C">C</option>
            <option value="C++">C++</option>
            <option value="Python">Python</option>
            <option value="java">java</option>
    </form>
</fieldset>

</body>
</html>
